name: Build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: unzip -q instant-rebreak.zip
      - run: chmod +x instant-rebreak/gradlew
      - run: cd instant-rebreak && ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: instant-rebreak-jar
          path: instant-rebreak/build/libs/*.jar
